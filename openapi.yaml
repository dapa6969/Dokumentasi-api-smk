- name: Akademik
  description: Data siswa, guru, kelas, jurusan, nilai, tugas, dan rapor
- name: Absensi
  description: Pencatatan kehadiran setiap pertemuan
- name: Perpustakaan
  description: Katalog buku, eksemplar, peminjaman, dan pengembalian
- name: Koperasi
  description: Produk, persediaan, penjualan, dan laporan koperasi
- name: Kantin
  description: Menu, persediaan, kasir, dan pemesanan makanan
- name: Sistem
  description: Informasi dan pemeriksaan operasional API
