openapi: 3.0.3
info:
  title: SMK School Management API
  version: 0.3.0-draft
  description: 'DRAFT API contract for Odoo 19 Community + Vue.js. Endpoints are proposals, not deployed services. Role names are logical permissions; mapping to Odoo groups must be agreed. Authentication uses Odoo session cookie as proposed baseline, subject to team approval. All authorization enforced by Odoo.

    OpenAPI source of truth for team review; includes Excel student import.'
servers:
- url: http://localhost:8069
  description: Odoo local (example only)
tags:
- name: Auth
- name: Accounts
- name: Academy
- name: Attendance
- name: Library
- name: Cooperative
- name: Canteen
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login using Odoo-backed authentication
      description: 'Allowed logical roles: system_admin, academic_admin, subject_teacher, homeroom_teacher, student, library_staff, cooperative_staff, canteen_staff. Record scope enforced by backend.'
      operationId: post_api_v1_auth_login
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                required:
                - success
                - data
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Conflict
        '422':
          description: Validation error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout current session
      description: 'Allowed logical roles: system_admin, academic_admin, subject_teacher, homeroom_teacher, student, library_staff, cooperative_staff, canteen_staff. Record scope enforced by backend.'
      operationId: post_api_v1_auth_logout
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required: []
                required:
                - success
                - data
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Conflict
        '422':
          description: Validation error
      security:
      - odooSession: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Current user and roles
      description: 'Allowed logical roles: system_admin, academic_admin, subject_teacher, homeroom_teacher, student, library_staff, cooperative_staff, canteen_staff. Record scope enforced by backend.'
      operationId: get_api_v1_auth_me
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                required:
                - success
                - data
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Conflict
        '422':
          description: Validation error
      security:
      - odooSession: []
  /api/v1/accounts:
    get:
      tags:
      - Accounts
      summary: List accounts (restricted)
      description: 'Allowed logical roles: system_admin. Record scope enforced by backend.'
      operationId: get_api_v1_accounts
