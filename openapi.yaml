components:
  securitySchemes:
    odooSession:
      type: apiKey
      in: cookie
      name: session_id
      description: Proposed Odoo session; never expose cookie to JavaScript. Confirm CSRF and CORS strategy.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          required: []
      required:
      - success
      - error
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          format: int64
        per_page:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
      required: []
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - system_admin
            - academic_admin
            - subject_teacher
            - homeroom_teacher
            - student
            - library_staff
            - cooperative_staff
            - canteen_staff
        active:
          type: boolean
        student_id:
          type: integer
          format: int64
        teacher_id:
          type: integer
          format: int64
      required:
      - id
      - login
      - name
      - roles
      - active
    Student:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nis:
          type: string
        nisn:
          type: string
        name:
          type: string
        class_id:
          type: integer
          format: int64
        major_id:
          type: integer
          format: int64
        academic_year_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - active
          - graduated
          - transferred
          - inactive
      required:
      - id
      - nis
      - name
      - status
    Teacher:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_number:
          type: string
        name:
          type: string
        user_id:
          type: integer
          format: int64
        active:
          type: boolean
      required:
      - id
      - name
    Major:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
      required:
      - id
      - code
      - name
    Classroom:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        grade:
          type: integer
          enum:
          - 10
          - 11
          - 12
        major_id:
          type: integer
          format: int64
        academic_year_id:
          type: integer
          format: int64
        homeroom_teacher_id:
          type: integer
          format: int64
      required:
      - id
      - name
      - grade
      - major_id
    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        active:
          type: boolean
      required:
      - id
      - name
    Semester:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        academic_year_id:
          type: integer
          format: int64
        sequence:
          type: integer
          enum:
          - 1
          - 2
      required:
      - id
      - name
    Subject:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
      required:
      - id
      - name
    TeachingAssignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        teacher_id:
          type: integer
          format: int64
        class_id:
          type: integer
          format: int64
        subject_id:
          type: integer
          format: int64
        academic_year_id:
          type: integer
          format: int64
        semester_id:
          type: integer
          format: int64
      required:
      - id
      - teacher_id
      - class_id
      - subject_id
    HomeroomAssignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        teacher_id:
          type: integer
          format: int64
        class_id:
          type: integer
          format: int64
        academic_year_id:
          type: integer
          format: int64
      required:
      - id
      - teacher_id
      - class_id
      - academic_year_id
    AttendanceSession:
      type: object
      properties:
        id:
          type: integer
          format: int64
        class_id:
          type: integer
          format: int64
        subject_id:
          type: integer
          format: int64
        teacher_id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        status:
          type: string
          enum:
          - draft
          - open
          - closed
      required:
      - id
      - class_id
      - date
    AttendanceRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        student_id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - present
          - sick
          - excused
          - absent
          - late
        note:
          type: string
      required:
      - id
      - session_id
      - student_id
      - status
    Book:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isbn:
          type: string
        title:
          type: string
        author:
          type: string
        category:
          type: string
        total_copies:
          type: integer
          format: int64
        available_copies:
          type: integer
          format: int64
      required:
      - id
      - title
    Loan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        book_id:
          type: integer
          format: int64
        student_id:
          type: integer
          format: int64
        borrower_user_id:
          type: integer
          format: int64
        borrowed_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
        returned_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - requested
          - approved
          - borrowed
          - returned
          - overdue
          - rejected
      required:
      - id
      - book_id
      - status
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        stock_qty:
          type: number
          minimum: 0
        active:
          type: boolean
      required:
      - id
      - name
      - price
    TransactionItem:
      type: object
      properties:
        product_id:
          type: integer
          format: int64
        quantity:
          type: number
          minimum: 0.001
        unit_price:
          type: number
          minimum: 0
      required:
      - product_id
      - quantity
    Transaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        customer_user_id:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'
        total:
          type: number
        status:
          type: string
          enum:
          - draft
          - confirmed
          - paid
          - cancelled
          - refunded
        created_at:
          type: string
          format: date-time
      required:
      - id
      - items
      - total
      - status
    ImportPreview:
      type: object
      properties:
        import_id:
          type: string
        filename:
          type: string
        total_rows:
          type: integer
          format: int64
        valid_rows:
          type: integer
          format: int64
        invalid_rows:
          type: integer
          format: int64
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
                format: int64
              field:
                type: string
              message:
                type: string
            required: []
      required:
      - import_id
      - total_rows
      - valid_rows
      - invalid_rows
      - errors
    ImportCommitResult:
      type: object
      properties:
        import_id:
          type: string
        created:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
      required:
      - import_id
      - created
      - skipped
      - failed
    LoginRequest:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
          format: password
      required:
      - login
      - password
    AccountProvisionRequest:
      type: object
      properties:
        student_ids:
          type: array
          items:
            type: integer
            format: int64
        teacher_ids:
          type: array
          items:
            type: integer
            format: int64
        send_invites:
          type: boolean
          default: false
      required: []
    AccountProvisionResult:
      type: object
      properties:
        created:
          type: integer
          format: int64
        already_linked:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        errors:
          type: array
          items:
            type: string
      required: []
    Grade:
      type: object
      properties:
        id:
          type: integer
          format: int64
        student_id:
          type: integer
          format: int64
        teaching_assignment_id:
          type: integer
          format: int64
        assessment_name:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
        published:
          type: boolean
      required:
      - id
      - student_id
      - teaching_assignment_id
      - score
    Assignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        teaching_assignment_id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        due_at:
          type: string
          format: date-time
      required:
      - id
      - teaching_assignment_id
      - title
    ReportCard:
      type: object
      properties:
        id:
          type: integer
          format: int64
        student_id:
          type: integer
          format: int64
        semester_id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - draft
          - reviewed
          - published
        notes:
          type: string
      required:
      - id
      - student_id
      - semester_id
      - status
