openapi: 3.0.3
info:
  title: Dokumentasi API Sistem Manajemen SMK — Odoo 19 dan Vue.js
  version: 1.0.0-draft
  description: 'DOKUMEN KONTRAK API (RANCANGAN, BELUM OTOMATIS BERJALAN).


    Sistem terdiri atas backend Odoo 19 Community dan frontend Vue.js. Modul backend: Academy, Attendance,
    Library, Cooperative, dan Canteen. Semua modul menggunakan basis data Odoo yang terintegrasi.


    ATURAN UMUM: Endpoint menggunakan awalan /api/v1 dan pertukaran data JSON. Respons sukses menggunakan success
    dan data, dengan meta untuk halaman daftar. Respons gagal menggunakan success=false serta error yang memuat
    code, message, dan details bila diperlukan. Parameter halaman adalah page dan per_page. Nominal uang berupa
    angka rupiah. NIS/NISN berupa teks agar angka nol di depan tidak hilang. Tanggal menggunakan YYYY-MM-DD
    dan waktu menggunakan ISO 8601.


    AUTENTIKASI: Menggunakan sesi Odoo melalui cookie session_id. Cookie harus diatur dengan HttpOnly dan Secure
    pada HTTPS, serta SameSite yang sesuai. Vue.js dan API sebaiknya berada pada origin yang sama melalui reverse
    proxy. Semua operasi yang mengubah data wajib memiliki perlindungan CSRF sesuai implementasi controller
    Odoo 19. Tidak menggunakan JWT.


    OTORISASI: Penanda x-roles dan x-data-scope menjelaskan role dan cakupan data. Backend wajib menerapkannya
    menggunakan grup Odoo, ACL, record rules, dan validasi kepemilikan atau penugasan. Menyembunyikan menu
    di frontend tidak menggantikan pemeriksaan izin backend.


    IMPLEMENTASI: Semua endpoint /api/v1 adalah controller khusus yang perlu dibuat oleh developer Odoo. Model
    pada schema menjelaskan kontrak JSON, bukan otomatis model database. Backend wajib memvalidasi setiap field
    yang boleh dibuat atau diubah. ID, status, harga, stok, role, dan waktu pencatatan tidak boleh diubah sembarangan.
    Hindari sudo() tanpa pemeriksaan izin yang eksplisit.


    PERUBAHAN DARI VERSI SEBELUMNYA: majors menjadi departments, summary absensi menjadi recap, products kantin
    menjadi menus, transactions koperasi/kantin menjadi sales, dan penyimpanan import menggunakan /imports/{batch_id}/commit.
    Selaraskan perubahan ini dengan frontend dan backend.


    TAHAP PENGEMBANGAN: x-phase menandai fitur MVP (wajib tahap pertama) atau Fase 2 (pengembangan berikutnya).
    Fase 2 mencakup pemesanan makanan siswa. Semua endpoint harus diuji sebelum dinyatakan siap digunakan.'
  contact:
    name: Tim Pengembang Sistem SMK
servers:
- url: http://localhost:8069
  description: Server Odoo lokal untuk pengembangan; hanya berfungsi setelah controller dibuat
- url: /
  description: Alamat yang sama untuk Vue.js dan API melalui reverse proxy (direkomendasikan)
