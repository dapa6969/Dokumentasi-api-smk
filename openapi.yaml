components:
  securitySchemes:
    odooSession:
      type: apiKey
      in: cookie
      name: session_id
      description: Cookie sesi Odoo dikirim otomatis oleh browser. Jangan membacanya menggunakan JavaScript.
        Perlindungan CSRF tetap wajib untuk operasi yang mengubah data.
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: Akses ditolak
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - success
      - error
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 125
        total_pages:
          type: integer
          example: 7
      required:
      - page
      - per_page
      - total
      - total_pages
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
      required:
      - success
      - data
    Role:
      type: string
      enum:
      - system_admin
      - academic_admin
      - subject_teacher
      - homeroom_teacher
      - student
      - library_staff
      - cooperative_staff
      - canteen_staff
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        login:
          type: string
          example: '26001'
        name:
          type: string
          example: Andi Pratama
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
        student_id:
          type: integer
          nullable: true
        teacher_id:
          type: integer
          nullable: true
        active:
          type: boolean
          example: true
      required:
      - id
      - login
      - name
      - roles
      - permissions
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          example: '26001'
        password:
          type: string
          example: password-pengguna
          description: Jangan simpan di localStorage atau log
      required:
      - login
      - password
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
      required:
      - current_password
      - new_password
    AccountProvisionRequest:
      type: object
      properties:
        user_type:
          type: string
          enum:
          - student
          - teacher
          - staff
        record_ids:
          type: array
          items:
            type: integer
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        send_activation:
          type: boolean
          example: false
      required:
      - user_type
      - record_ids
    AccountProvisionResult:
      type: object
      properties:
        created_count:
          type: integer
          example: 10
        skipped_count:
          type: integer
          example: 1
        errors:
          type: array
          items:
            type: object
            properties:
              record_id:
                type: integer
              message:
                type: string
      required:
      - created_count
      - skipped_count
      - errors
    Department:
